<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Archivo+Black&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1080px}
  .art{width:1080px;height:1080px;position:relative;overflow:hidden;background:#fbfbf9;font-family:'Archivo',sans-serif;color:#141414}
  .gl{position:absolute;background:#e7e7e2}.gl.v{top:0;bottom:0;width:1px}.gl.h{left:0;right:0;height:1px}
  .wrap{position:absolute;left:84px;right:74px;top:118px;z-index:2}
  h1{font-family:'Archivo',sans-serif;font-weight:700;font-size:58px;line-height:1.14;letter-spacing:-.015em;color:#1c1c1a;max-width:900px}
  h1 .hl{font-family:'Archivo Black',sans-serif;font-weight:400;color:#0f9e6a;text-decoration:underline;text-decoration-color:#0f9e6a;text-decoration-thickness:6px;text-underline-offset:8px;text-decoration-skip-ink:none}
  .cta{display:inline-block;margin-top:44px;background:#0f9e6a;color:#fff;font-family:'Archivo Black';font-weight:400;font-size:30px;padding:21px 38px;border-radius:16px;box-shadow:0 14px 30px rgba(0,0,0,.16)}
  .logos{position:absolute;right:78px;bottom:104px;display:flex;gap:34px;align-items:center;z-index:1}
  .logos .lg{height:140px;width:auto;display:block}
  .foot{position:absolute;left:84px;bottom:40px;z-index:2;font-weight:600;font-size:18px;color:#a8a8a2}
</style></head><body>
  <div class="art">
    <div class="gl v" style="left:48px"></div><div class="gl v" style="right:48px"></div>
    <div class="gl h" style="top:60px"></div><div class="gl h" style="top:742px"></div>
    <div class="wrap">
      <h1><span class="hl">Cut costs and keep more profit</span> by implementing AI and automation in your business.</h1>
      <div class="cta">Get your free audit →</div>
    </div>
    <div class="logos">
    <img class="lg" src="../brand/logo_claude.svg" alt="Claude">
    <img class="lg" src="../brand/logo_chatgpt.svg" alt="ChatGPT">
    <img class="lg" src="../brand/logo_gemini.svg" alt="Gemini">
  </div>
    <div class="foot">nilsdigital.com/automation</div>
  </div>
</body></html>
