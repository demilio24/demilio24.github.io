<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--green:#0fbf7a;--neon:#00ff88;--neon-soft:#6dffa6;--bg:#03110a;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px}
  .art{width:1080px;height:1080px;position:relative;overflow:hidden;
    background:radial-gradient(130% 80% at 0% 0%,rgba(0,255,136,.12),transparent 55%),var(--bg);
    font-family:'Inter',sans-serif;color:#fff;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    text-align:left;padding:96px 90px}
  .art::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(0,255,136,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.045) 1px,transparent 1px);
    background-size:50px 50px;
    -webkit-mask-image:linear-gradient(120deg,#000 30%,transparent 85%);mask-image:linear-gradient(120deg,#000 30%,transparent 85%)}
  /* faint oversized arrow in the negative space, lower-right */
  .ghost{position:absolute;right:-40px;bottom:-30px;font-family:'Anton';font-size:520px;line-height:.7;
    color:rgba(0,255,136,.05);transform:rotate(8deg);pointer-events:none}
  .eyebrow{position:relative;display:flex;align-items:center;gap:13px;
    font-weight:800;letter-spacing:.36em;font-size:22px;text-transform:uppercase;color:var(--neon-soft);
    text-indent:.36em;margin-bottom:34px}
  .eyebrow .dot{width:12px;height:12px;border-radius:50%;background:var(--neon);box-shadow:0 0 16px var(--neon);text-indent:0}
  h1{position:relative;font-family:'Anton',sans-serif;font-weight:400;font-size:126px;line-height:1.08;
    letter-spacing:.5px;text-transform:uppercase;max-width:860px;margin-bottom:38px}
  /* neon highlighter behind one word (Hormozi device, in brand color) */
  .hl{color:#04140c;white-space:nowrap;padding:0 .1em;border-radius:6px;
    background:linear-gradient(135deg,var(--neon-soft),var(--neon));
    -webkit-box-decoration-break:clone;box-decoration-break:clone}
  .sub{position:relative;font-weight:600;font-size:38px;line-height:1.32;color:#cfe7da;max-width:760px;margin-bottom:48px}
  .cta{position:relative;display:inline-flex;align-items:center;gap:14px;
    background:linear-gradient(135deg,var(--neon-soft),var(--neon));color:#04140c;font-weight:800;font-size:34px;
    padding:26px 50px;border-radius:999px;box-shadow:0 16px 44px rgba(0,255,136,.32)}
  .foot{position:absolute;left:90px;bottom:56px;font-weight:600;font-size:23px;color:#7fa392;letter-spacing:.02em}
  .foot b{color:#cfe7da;font-weight:700}
</style>
</head>
<body>
  <div class="art">
    <div class="ghost">↗</div>
    <div class="eyebrow"><span class="dot"></span>Nils Digital · AI Audit</div>
    <h1>We find the <span class="hl">money</span> hiding in your business.</h1>
    <div class="sub">A 14-day AI audit. Then we build only what pays for itself.</div>
    <div class="cta">Book your audit →</div>
    <div class="foot"><b>50 five-star reviews</b> &nbsp;·&nbsp; nilsdigital.com/automation</div>
  </div>
</body>
</html>
