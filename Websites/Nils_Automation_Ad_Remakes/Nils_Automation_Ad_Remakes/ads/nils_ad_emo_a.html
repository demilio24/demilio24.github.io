<!doctype html><html><head><meta charset="utf-8" /><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Archivo+Black&display=swap" rel="stylesheet" /><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1080px}
.art{width:1080px;height:1080px;position:relative;overflow:hidden;background:#03110a;font-family:'Archivo',sans-serif}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;filter:contrast(1.05) brightness(.82) grayscale(.15)}
.tint{position:absolute;inset:0;background:#0c7a4f;mix-blend-mode:color;opacity:.5}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,12,8,.55),rgba(2,12,8,.05) 30%,rgba(2,12,8,.55) 60%,rgba(2,12,8,.97)),linear-gradient(90deg,rgba(2,12,8,.6),transparent 55%)}
.glow{position:absolute;top:-10%;right:-10%;width:60%;height:55%;background:radial-gradient(circle,rgba(20,224,138,.22),transparent 70%)}
.wrap{position:absolute;left:74px;right:74px;bottom:78px;z-index:3}
.kick{font-family:'Archivo Black';font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#19e08a;margin-bottom:18px}
h1{font-family:'Archivo Black';font-weight:400;font-size:90px;line-height:.99;letter-spacing:-.02em;color:#fff}
h1 .acc{color:#19e08a}
.tag{font-family:'Archivo Black';font-size:34px;color:#fff;margin:24px 0 30px}
.cta{display:inline-block;background:linear-gradient(135deg,#1ee087,#0fbf7a);color:#04140c;font-family:'Archivo Black';font-size:32px;padding:23px 40px;border-radius:16px;box-shadow:0 16px 40px rgba(15,191,122,.35)}
.foot{position:absolute;left:74px;bottom:38px;z-index:3;font-weight:600;font-size:18px;color:rgba(255,255,255,.5)}
</style></head><body><div class="art">
<img class="bg" src="../brand/emo_burnout.jpg" alt=""><div class="tint"></div><div class="grad"></div><div class="glow"></div>
<div class="wrap">
  <div class="kick">Still doing it the hard way?</div>
  <h1><span class="acc">You're still running</span><br>your business by hand.</h1>
  <div class="tag">Reclaim 20+ hours a week.</div>
  <div class="cta">Get the free audit</div>
</div>
<div class="foot">nilsdigital.com/automation</div>
</div></body></html>
