<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px}
  .art{width:1080px;height:1080px;position:relative;overflow:hidden;background:#f5f8f6;
    font-family:'Inter',sans-serif;color:#08160f;display:flex;flex-direction:column;padding:48px 58px 0}
  .bar{position:absolute;top:0;left:0;right:0;height:11px;background:linear-gradient(90deg,#14c982,#0a8c5a)}
  .photo{width:100%;height:404px;border-radius:24px;overflow:hidden;box-shadow:0 22px 54px rgba(10,40,28,.18);
    border:1px solid #e2eae5;margin:6px 0 30px;position:relative;flex:0 0 auto}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 32%;display:block}
  h1{font-weight:800;font-size:54px;line-height:1.08;letter-spacing:-.02em;margin-bottom:26px;max-width:940px}
  h1 .g{color:#0fbf7a}
  .bens{display:flex;flex-direction:column;gap:15px;margin-bottom:32px}
  .ben{display:flex;align-items:center;gap:15px;font-weight:600;font-size:30px;color:#23362d}
  .ben .ck{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:linear-gradient(135deg,#1ee087,#0fbf7a);
    color:#04140c;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
  .cta{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:linear-gradient(135deg,#1ee087,#0fbf7a);
    color:#04140c;font-weight:800;font-size:31px;padding:23px 44px;border-radius:999px;box-shadow:0 14px 38px rgba(15,191,122,.32)}
  .foot{position:absolute;left:58px;right:58px;bottom:38px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px;color:#9bb0a6}
  .foot .nlogo{height:20px;width:auto;opacity:.65}
  .foot .rev{color:#0a7d4f;font-weight:700}
  .foot .url{margin-left:auto;font-size:17px;color:#9bb0a6}
</style></head><body>
  <div class="art">
    <div class="bar"></div>
    <div class="photo"><img src="../brand/founder.jpg" alt=""></div>
    <h1>We implement AI so you can <span class="g">buy back your time.</span></h1>
    <div class="bens"><div class="ben"><span class="ck">✓</span>Stop drowning in repetitive manual work</div><div class="ben"><span class="ck">✓</span>Reclaim 20+ hours every week</div><div class="ben"><span class="ck">✓</span>Work ON your business, not in it</div></div>
    <div class="cta">See where AI fits in your business <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#04140c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="4" x2="12" y2="19"/><polyline points="6 13 12 19 18 13"/></svg></div>
    <div class="foot"><img class="nlogo" src="../brand/n-black.png" alt=""><span class="rev">★★★★★ 200+ businesses</span><span class="url">nilsdigital.com/automation</span></div>
  </div>
</body></html>
