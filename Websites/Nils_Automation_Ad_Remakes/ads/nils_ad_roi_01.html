<!doctype html><html lang="en"><head><meta charset="utf-8" /><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1080px}
    .art{width:1080px;height:1080px;position:relative;overflow:hidden;background:#f5f8f6;font-family:'Inter',sans-serif;color:#08160f;display:flex;flex-direction:column}
    .bar{position:absolute;top:0;left:0;right:0;height:11px;background:linear-gradient(90deg,#14c982,#0a8c5a)}.foot{position:absolute;left:84px;right:84px;bottom:46px;display:flex;align-items:center;font-weight:600;font-size:19px;color:#9bb0a6}
.foot .rev{color:#0a7d4f;font-weight:700}.foot .url{margin-left:auto;font-size:17px;color:#9bb0a6}.art{justify-content:center;padding:96px 84px}
      .pre{position:relative;font-weight:700;font-size:38px;color:#41524b;margin-bottom:4px;max-width:820px}
      .big{position:relative;font-family:'Anton',sans-serif;font-weight:400;font-size:300px;line-height:.9;letter-spacing:-2px;white-space:nowrap;
        background:linear-gradient(135deg,#1ee087,#0a8c5a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
      .post{position:relative;font-weight:800;font-size:54px;line-height:1.08;color:#08160f;max-width:860px;margin-bottom:30px}
      .detail{position:relative;font-weight:500;font-size:31px;line-height:1.4;color:#41524b;max-width:840px}</style></head><body><div class="art"><div class="bar"></div><div class="pre">What we found inside one business:</div><div class="big flex">$204,880</div><div class="post">in annual value, sitting unclaimed.</div><div class="detail">54 hrs/week wasted on admin. 38 pain points. 15 automation opportunities. From one 14-day audit.</div><div class="foot"><span class="rev">★★★★★ 200+ businesses</span><span class="url">nilsdigital.com/automation</span></div></div>
<script>function fit(){var b=document.querySelector('.big');if(!b)return;var a=document.querySelector('.art');var s=parseFloat(getComputedStyle(b).fontSize),g=0;while(b.scrollWidth>a.clientWidth-168&&s>80&&g<120){s-=4;b.style.fontSize=s+'px';g++;}}if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);window.addEventListener('load',fit);</script>
</body></html>
