<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{--green:#0fbf7a;--green-light:#34d399;--neon:#00ff88;--neon-soft:#6dffa6;--bg:#03110a;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px}
  .art{
    width:1080px;height:1080px;position:relative;overflow:hidden;
    background:
      radial-gradient(90% 60% at 50% -5%, rgba(15,191,122,.16), transparent 60%),
      var(--bg);
    font-family:'Inter',sans-serif;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:96px 90px;
  }
  .art::before{content:"";position:absolute;inset:0;
    background-image:
      radial-gradient(rgba(0,255,136,.5) 1.4px,transparent 1.6px);
    background-size:60px 60px;opacity:.10}
  .top{position:relative;font-weight:600;font-size:38px;line-height:1.28;color:#cfe7da;max-width:760px}
  .top b{color:#fff;font-weight:800}
  .figure{position:relative;font-weight:900;font-size:188px;line-height:1;letter-spacing:-.03em;margin:8px 0 2px;
    text-shadow:0 0 60px rgba(0,255,136,.25)}
  .unlocked{position:relative;font-weight:800;font-size:46px;letter-spacing:-.01em;
    background:linear-gradient(135deg,var(--neon-soft),var(--green));
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:46px}
  .stats{position:relative;display:flex;align-items:stretch;gap:0;margin-bottom:34px}
  .stat{padding:0 34px;max-width:230px}
  .stat + .stat{border-left:1.5px solid rgba(255,255,255,.16)}
  .stat .n{font-weight:800;font-size:34px;color:var(--neon-soft)}
  .stat .l{font-weight:500;font-size:23px;line-height:1.2;color:#b6cabf;margin-top:6px}
  .from{position:relative;font-weight:600;font-size:26px;color:#cfe7da;
    padding-bottom:8px;border-bottom:2px solid var(--green);margin-bottom:48px}
  .q{position:relative;font-weight:800;font-size:48px;letter-spacing:-.01em;margin-bottom:34px}
  .cta{position:relative;display:inline-flex;align-items:center;gap:14px;
    background:linear-gradient(135deg,var(--neon-soft),var(--neon));
    color:#04140c;font-weight:800;font-size:32px;padding:26px 52px;border-radius:999px;
    box-shadow:0 14px 40px rgba(0,255,136,.32)}
  .brand{position:absolute;top:54px;left:0;right:0;text-align:center;
    font-weight:700;letter-spacing:.42em;font-size:21px;color:var(--neon-soft);
    text-transform:uppercase;text-indent:.42em}
</style>
</head>
<body>
  <div class="art">
    <div class="top">What we found <b>inside</b> one<br>U.S. small business:</div>
    <div class="figure">$204,880</div>
    <div class="unlocked">in annual value unlocked</div>
    <div class="stats">
      <div class="stat"><div class="n">54 hrs/week</div><div class="l">wasted on admin</div></div>
      <div class="stat"><div class="n">38 pain points</div><div class="l">found</div></div>
      <div class="stat"><div class="n">15 automation</div><div class="l">opportunities</div></div>
    </div>
    <div class="from">From a 6-session AI audit.</div>
    <div class="q">Want to see what's in yours?</div>
    <div class="cta">Book your AI Audit →</div>
  </div>
</body>
</html>
