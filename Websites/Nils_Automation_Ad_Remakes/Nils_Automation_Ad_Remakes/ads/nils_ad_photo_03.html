<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px}
  .art{width:1080px;height:1080px;position:relative;overflow:hidden;background:#f5f8f6;
    font-family:'Inter',sans-serif;color:#08160f;display:flex;flex-direction:column;padding:58px 58px 0}
  .bar{position:absolute;top:0;left:0;right:0;height:11px;background:linear-gradient(90deg,#14c982,#0a8c5a)}
  .photo{width:100%;height:566px;border-radius:26px;overflow:hidden;box-shadow:0 24px 60px rgba(10,40,28,.18);
    border:1px solid #e2eae5;margin:6px 0 36px;position:relative;flex:0 0 auto}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 32%;display:block}
  .photo .ring{position:absolute;inset:0;border-radius:26px;box-shadow:inset 0 0 0 3px rgba(15,191,122,.0)}
  h1{font-weight:800;font-size:62px;line-height:1.05;letter-spacing:-.02em;margin-bottom:16px;max-width:940px}
  h1 .g{color:#0fbf7a}
  .sub{font-weight:500;font-size:31px;line-height:1.34;color:#41524b;margin-bottom:30px;max-width:880px}
  .cta{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:linear-gradient(135deg,#1ee087,#0fbf7a);
    color:#04140c;font-weight:800;font-size:31px;padding:23px 44px;border-radius:999px;box-shadow:0 14px 38px rgba(15,191,122,.32)}
  .foot{position:absolute;left:58px;right:58px;bottom:40px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px;color:#9bb0a6}
  .foot .nlogo{height:20px;width:auto;opacity:.65}
  .foot .rev{color:#0a7d4f;font-weight:700}
  .foot .url{margin-left:auto;font-size:17px;color:#9bb0a6}
</style></head><body>
  <div class="art">
    <div class="bar"></div>
    <div class="photo"><img src="../brand/founder.jpg" alt=""><div class="ring"></div></div>
    <h1>We don't just talk about AI. <span class="g">We build it.</span></h1>
    <div class="sub">200+ businesses audited and automated. Yours is next.</div>
    <div class="cta">Book a free strategy call →</div>
    <div class="foot"><img class="nlogo" src="../brand/n-black.png" alt=""><span class="rev">★★★★★ 200+ businesses</span><span class="url">nilsdigital.com/automation</span></div>
  </div>
</body></html>
