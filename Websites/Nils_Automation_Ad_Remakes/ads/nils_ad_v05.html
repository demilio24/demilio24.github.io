<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Archivo+Black&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1080px}
  .art{width:1080px;height:1080px;position:relative;overflow:hidden;background:#fbfbf9;font-family:'Archivo',sans-serif;color:#141414}

  .wrap{position:absolute;left:84px;right:72px;top:96px;z-index:2}

  .emph{font-weight:700;font-size:32px;line-height:1.2;color:#141414;max-width:760px;margin-bottom:13px}
  .tag{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:32px;color:#2f6fed;margin-bottom:32px}
  .cta{display:inline-block;background:#2f6fed;color:#fff;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:32px;padding:23px 38px;border-radius:18px;box-shadow:0 14px 30px rgba(0,0,0,.18)}

  <div class="art">

    <div class="wrap">
      <h1><span class="acc">Your competitor isn't</span><br><span class="blk">working harder than you.</span></h1>
