<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1080px}
  .art{width:1080px;height:1080px;position:relative;overflow:hidden;color:#141414;font-family:'Inter',sans-serif;background:radial-gradient(46% 42% at 13% 6%,rgba(47,111,237,.28),transparent 60%),radial-gradient(52% 46% at 93% 96%,rgba(0,200,255,.24),transparent 58%),radial-gradient(42% 38% at 80% 16%,rgba(124,77,255,.18),transparent 60%),radial-gradient(40% 36% at 26% 90%,rgba(0,224,180,.13),transparent 62%),#eef3fe}
  .art::before{content:'';position:absolute;inset:0;z-index:0;background-image:linear-gradient(rgba(47,111,237,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(47,111,237,.11) 1px,transparent 1px);background-size:58px 58px;-webkit-mask-image:radial-gradient(82% 72% at 32% 30%,#000 18%,transparent 80%);mask-image:radial-gradient(82% 72% at 32% 30%,#000 18%,transparent 80%)}
  .art::after{content:'';position:absolute;width:620px;height:620px;right:-140px;top:-160px;border-radius:50%;z-index:0;background:radial-gradient(circle,rgba(0,200,255,.30),transparent 70%);filter:blur(46px)}
  .subcta{margin-top:16px;font-family:'Inter',sans-serif;font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#5d6b88}
  .gl{position:absolute;background:transparent}.gl.v{top:0;bottom:0;width:1px}.gl.h{left:0;right:0;height:1px}
  .wrap{position:absolute;left:84px;right:74px;top:118px;z-index:2}
  h1{font-family:'DM Sans',sans-serif;font-weight:500;font-size:58px;line-height:1.14;letter-spacing:-.015em;color:#1c1c1a;max-width:900px}
  h1 .hl{font-family:'DM Sans',sans-serif;font-weight:700;color:#2f6fed;text-decoration:underline;text-decoration-color:#2f6fed;text-decoration-thickness:6px;text-underline-offset:8px;text-decoration-skip-ink:none}
  .cta{display:inline-flex;align-items:center;gap:12px;margin-top:44px;background:#2f6fed;color:#fff;font-family:'Inter',sans-serif;font-weight:800;font-size:28px;padding:22px 40px;border-radius:999px;box-shadow:0 16px 38px rgba(0,0,0,.22)}
  .logos{position:absolute;right:78px;bottom:104px;display:flex;gap:34px;align-items:center;z-index:1}
  .logos .lg{height:140px;width:auto;display:block}
  .foot{position:absolute;left:84px;bottom:40px;z-index:2;font-weight:600;font-size:18px;color:#a8a8a2}
</style></head><body>
  <div class="art">
    <div class="gl v" style="left:48px"></div><div class="gl v" style="right:48px"></div>
    <div class="gl h" style="top:60px"></div><div class="gl h" style="top:742px"></div>
    <div class="wrap">
      <h1><span class="hl">Grow without hiring</span> by implementing AI and automation in your business.</h1>
      <div class="cta">See where AI fits in your business <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="4" x2="12" y2="19"/><polyline points="6 13 12 19 18 13"/></svg></div>
      <div class="subcta">Free business audit</div>
    </div>
    <div class="logos">
    <img class="lg" src="../brand/logo_claude.svg" alt="Claude">
    <img class="lg" src="../brand/logo_chatgpt.svg" alt="ChatGPT">
    <img class="lg" src="../brand/logo_gemini.svg" alt="Gemini">
  </div>
    <div class="foot">nilsdigital.com/automation</div>
  </div>
</body></html>
