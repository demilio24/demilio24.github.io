<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Archivo+Black&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1080px}
  .art{width:1080px;height:1080px;position:relative;overflow:hidden;background:#fbfbf9;font-family:'Archivo',sans-serif;color:#141414}
  .gl{position:absolute;background:#e7e7e2}.gl.v{top:0;bottom:0;width:1px}.gl.h{left:0;right:0;height:1px}
  .wrap{position:absolute;left:84px;right:74px;top:108px;z-index:2}
  .logos{position:absolute;right:78px;bottom:108px;display:flex;gap:34px;align-items:center;z-index:1}
  .logos .lg{height:152px;width:auto;display:block}
  .lead{font-family:'Archivo Black';font-weight:400;font-size:44px;line-height:1.05;letter-spacing:-.02em;color:#141414;margin-bottom:16px;max-width:840px}
  h1{font-family:'Archivo Black';font-weight:400;font-size:92px;line-height:.98;letter-spacing:-.025em;color:#0f9e6a;margin-bottom:40px;max-width:900px}
  .cta{display:inline-block;align-self:flex-start;background:#0f9e6a;color:#fff;font-family:'Archivo Black';font-weight:400;font-size:23px;padding:19px 30px;border-radius:16px;box-shadow:0 14px 30px rgba(0,0,0,.16);max-width:900px}
  .foot{position:absolute;left:84px;bottom:40px;z-index:2;font-weight:600;font-size:18px;color:#a8a8a2}
</style></head><body>
  <div class="art">
    <div class="gl v" style="left:48px"></div><div class="gl v" style="right:48px"></div>
    <div class="gl h" style="top:60px"></div><div class="gl h" style="top:742px"></div>
    <div class="wrap">
      <div class="lead">We will implement AI in your business</div>
      <h1>so you can cut costs and keep more profit.</h1>
      <div class="cta">Get an AI and automation audit for your business →</div>
    </div>
    <div class="logos">
    <img class="lg" src="../brand/logo_claude.svg" alt="Claude">
    <img class="lg" src="../brand/logo_chatgpt.svg" alt="ChatGPT">
    <img class="lg" src="../brand/logo_gemini.svg" alt="Gemini">
  </div>
    <div class="foot">nilsdigital.com/automation</div>
  </div>
</body></html>
